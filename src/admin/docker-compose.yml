services:
  aka-admin:
    build:
      context: ../../
      dockerfile: devops/docker/aka-admin/Dockerfile
      args:
        RUST_DEV_IMAGE_VERSION: $RUST_DEV_IMAGE_VERSION
        DEBIAN_SLIM_BASE_IMAGE_VERSION: $DEBIAN_SLIM_BASE_IMAGE_VERSION
    image: ${HUB_NAMESPACE:-dewey4iv}/aka-admin:${TAG:-latest}
    platform: $DOCKER_PLATFORM
    profiles: ["images"]

  # The dashboard: UI + API on one port, one origin.
  admin:
    image: ${HUB_NAMESPACE:-dewey4iv}/aka-admin:${TAG:-latest}
    platform: $DOCKER_PLATFORM
    restart: unless-stopped
    environment:
      # aka.<domain> for every domain aka serves; aka's own default domain is
      # `docker`, so add the rest: ADMIN_HOSTS=aka.docker,aka.test,aka.localhost
      VIRTUAL_HOST: ${ADMIN_HOSTS:-aka.docker}
      VIRTUAL_PORT: "80"
      AKA_HOME: /aka/home
      PORT: "80"
      RUST_LOG: ${RUST_LOG:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:80"
    volumes:
      - ${HOME}/.aka:/aka/home:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  # --- dev: source-mounted, hot-reloading, no image build ------------------
  # watchexec rebuilds the API; trunk serves the dev bundle. The web container
  # compiles ADMIN_API_URL in, because trunk and the API are different origins
  # here (unlike the image, where one port serves both).

  admin-api:
    working_dir: /home/rust/src/admin
    command: /bin/bash -c 'watchexec -c -e rs -r cargo run --bin admin-api'
    image: registry.vizerapp.cloud/lib/rust-dev:$RUST_DEV_IMAGE_VERSION
    platform: $DOCKER_PLATFORM
    stdin_open: true
    tty: true
    profiles: ["dev"]
    environment:
      CARGO_TARGET_DIR: /home/rust/shared_target
      VIRTUAL_HOST: ${ADMIN_API_HOSTS:-aka-api.docker}
      # aka's runtime home, from the host (see the volumes below)
      AKA_HOME: /aka/home
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:${ADMIN_API_PORT:-3000}:80"
    volumes:
      - "shared-vol:/home/rust/shared_target"
      - ../../:/home/rust/src/admin:cached
      - ${HOME}/.aka:/aka/home:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

  admin-web:
    working_dir: /home/rust/src/admin/src/admin/admin-web
    command: /bin/bash -c 'trunk serve'
    build:
      context: ../../
      dockerfile: devops/docker/stylance/Dockerfile
      args:
        TARGETVERSION: $RUST_DEV_IMAGE_VERSION
    platform: $DOCKER_PLATFORM
    stdin_open: true
    tty: true
    depends_on:
      - admin-api
    profiles: ["dev"]
    environment:
      CARGO_TARGET_DIR: /home/rust/shared_target
      VIRTUAL_HOST: ${ADMIN_HOSTS:-aka.docker}
      # baked into the wasm bundle at compile time (option_env!)
      ADMIN_API_URL: http://localhost:${ADMIN_API_PORT:-3000}
    env_file:
      - ../../.env
    ports:
      - "127.0.0.1:${ADMIN_WEB_PORT:-3002}:80"
    volumes:
      - "shared-vol:/home/rust/shared_target"
      - ../../:/home/rust/src/admin:cached
