[package]
name = "admin-api"
version = "0.2.1"
edition = "2024"

[dependencies]
admin-kernel = { path = "../admin-kernel" }
admin-http = { path = "../admin-http" }
admin-services = { path = "../admin-services" }
aka-docker = { path = "../../aka/aka-docker" }
aka-kernel = { path = "../../aka/aka-kernel" }
aka-services = { path = "../../aka/aka-services" }

# path-only requirements: a workspace-wide version bump (bin/version.sh)
# must not strand a pinned requirement behind the crate it points at
provider = { path = "../../xlib/provider" }
telemetry = { path = "../../xlib/telemetry" }

serde = { version = "1.0.228", features = ["derive"] }
axum = { version = "0.8.7", default-features = false, features = ["http1", "json", "macros", "matched-path", "original-uri", "tower-log", "query", "tokio"] }
tokio = { version = "1.43.0", features = ["full"] }
tower-http = { version = "0.6.2", features = ["cors", "fs"] }
tracing = "0.1.41"

[dev-dependencies]
async-trait = "0.1.89"
serde_json = "1.0.148"
tower = { version = "0.5.2", features = ["util"] }
