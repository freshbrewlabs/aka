[package]
name = "aka-cli"
version = "0.3.2"
edition = "2024"

[[bin]]
name = "aka"
path = "src/main.rs"

[dependencies]
aka-kernel = { path = "../aka-kernel" }
aka-docker = { path = "../aka-docker" }
aka-services = { path = "../aka-services" }

provider = { path = "../../xlib/provider" }
telemetry = { path = "../../xlib/telemetry" }

clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
serde_json = "1.0.148"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
