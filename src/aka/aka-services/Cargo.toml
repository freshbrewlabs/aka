[package]
name = "aka-services"
version = "0.4.0"
edition = "2024"

[dependencies]
aka-kernel = { path = "../aka-kernel" }
aka-docker = { path = "../aka-docker" }

chrono = "0.4.42"
futures = "0.3.34"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
toml = "0.9"
sha2 = "0.10.8"
tokio = { version = "1.43.0", features = ["full"] }
tracing = "0.1.41"
rcgen = "0.14.10"
x509-parser = "0.18.1"
ring = "0.17.14"
rsa = "0.9.10"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
time = "0.3"
rustls-pki-types = "1"
