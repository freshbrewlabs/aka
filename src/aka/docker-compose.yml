# aka dev compose: build the two managed images and run demo containers
# that declare aka routes.
#
#   docker compose build            # aka-proxy:local + aka-dns:local
#   docker compose up -d demo-web demo-cache
#   cargo run -p aka-cli -- up      # then: curl http://demo.docker

name: aka

services:
  aka-proxy:
    build:
      context: ../../devops/docker/aka-proxy
    image: aka-proxy:local
    profiles: ["images"]

  aka-dns:
    build:
      context: ../../devops/docker/aka-dns
    image: aka-dns:local
    profiles: ["images"]

  demo-web:
    image: nginx:alpine
    environment:
      VIRTUAL_HOST: demo.docker
      VIRTUAL_PORT: "80"

  demo-cache:
    image: redis:7-alpine
    environment:
      VIRTUAL_HOST: cache.docker
      VIRTUAL_PORT: "6379"
      VIRTUAL_PROTO: tcp
