# aka dev compose: build the two managed images and run demo containers
# that declare aka routes.
#
#   docker compose build            # ${HUB_NAMESPACE:-dewey4iv}/aka-{proxy,dns}:${TAG:-latest}
#   docker compose up -d demo-web demo-cache
#   cargo run -p aka-cli -- up      # then: curl http://demo.docker

name: aka

services:
  aka-proxy:
    build:
      context: ../../devops/docker/aka-proxy
    image: ${HUB_NAMESPACE:-dewey4iv}/aka-proxy:${TAG:-latest}
    profiles: ["images"]

  aka-dns:
    build:
      context: ../../devops/docker/aka-dns
    image: ${HUB_NAMESPACE:-dewey4iv}/aka-dns:${TAG:-latest}
    profiles: ["images"]

  demo-web:
    image: nginx:alpine
    environment:
      VIRTUAL_HOST: demo.docker
      VIRTUAL_PORT: "80"

  demo-cache:
    image: redis:7-alpine
    environment:
      VIRTUAL_HOST: cache.docker
      VIRTUAL_PORT: "6379"
      VIRTUAL_PROTO: tcp
