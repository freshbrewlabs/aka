apiVersion: apps/v1
kind: Deployment
metadata:
  name: aka-public
  labels:
    app: aka-public
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aka-public
  template:
    metadata:
      labels:
        app: aka-public
    spec:
      imagePullSecrets:
        - name: {{ template "aka-public.name" . }}-registry
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 101          # nginx user in the image
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: false   # nginx needs /var/cache + /var/run
