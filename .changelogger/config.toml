# changelogger
# Unreleased entries live as files in .changelogger/unreleased; `cl release`
# folds them into CHANGELOG.md (keepachangelog.com 1.1.0).

# Canonical ticket id form: number | zero_padded_number (5 digits, e.g. 00042) | string
ticket_id = "number"

# Ticket label for entry filenames and link text; `{id}` is required.
ticket_prefix = "{id}"

# Ticket URL; `{ticket_id}` and/or `{ticket_prefix}`. Unset = `cl new` prompts per entry.
ticket_link = "https://git.freshbrewlabs.cloud/freshbrewlabs/aka/issues/1{ticket_id}"

# AI Assist: `cl assist` drafts changelog bullets from the branch's
# diff against the default branch. Uncomment to preconfigure; otherwise
# `cl assist` prompts for these values on first run and saves them.
[llm]
host = "https://wolverine.0.lab.freshbrewlabs.com/v1"    # any OpenAI-compatible base URL
api_key = "50ff21e7-06ef-481a-8ce6-9d4c5bd36fd7"
api_kind = "openai_responses"         # or "openai_completions"
model = "nvidia/Qwen3.6-35B-A3B-NVFP4"
